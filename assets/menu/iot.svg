<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0" stop-color="#131210"/><stop offset="1" stop-color="#0C0B09"/>
</linearGradient>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
<path d="M50 0V50M0 50H50" fill="none" stroke="rgba(233,230,221,0.045)" stroke-width="1"/>
</pattern>
</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect width="800" height="500" fill="url(#grid)"/>
<!-- FIT is computed per frame: the motif is measured, then scaled and
     translated so every drawing sits dead centre and carries the same
     visual weight. The old wrapper scaled about (400,250), which is not
     the centre of a 480x300 canvas, so everything drifted up and left. -->
<g transform="translate(-170.38,-106.49) scale(1.4260)"
   stroke="rgba(233,230,221,0.72)" fill="none" stroke-width="1.32" stroke-linecap="square"
   vector-effect="non-scaling-stroke">
<rect x="211" y="141" width="34" height="34" stroke="rgba(233,230,221,0.62)"/><rect x="211" y="325" width="34" height="34" stroke="rgba(233,230,221,0.62)"/><rect x="555" y="141" width="34" height="34" stroke="rgba(233,230,221,0.62)"/><rect x="555" y="325" width="34" height="34" stroke="rgba(233,230,221,0.62)"/><line x1="228" y1="158" x2="400.0" y2="250.0" stroke="rgba(233,230,221,0.2)" stroke-dasharray="3 6"/><line x1="228" y1="342" x2="400.0" y2="250.0" stroke="rgba(233,230,221,0.2)" stroke-dasharray="3 6"/><line x1="572" y1="158" x2="400.0" y2="250.0" stroke="rgba(233,230,221,0.2)" stroke-dasharray="3 6"/><line x1="572" y1="342" x2="400.0" y2="250.0" stroke="rgba(233,230,221,0.2)" stroke-dasharray="3 6"/><circle cx="400.0" cy="250.0" r="20" stroke="rgba(233,230,221,0.92)" fill="rgba(233,230,221,0.14)"/><circle cx="400.0" cy="250.0" r="56" stroke="rgba(233,230,221,0.36)"/><circle cx="400.0" cy="250.0" r="96" stroke="rgba(233,230,221,0.22)"/><circle cx="400.0" cy="250.0" r="136" stroke="rgba(233,230,221,0.12)"/>
</g>
<rect x=".5" y=".5" width="799" height="499" fill="none" stroke="rgba(233,230,221,0.1)"/>

</svg>