<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0" stop-color="#131210"/><stop offset="1" stop-color="#0C0B09"/>
</linearGradient>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
<path d="M50 0V50M0 50H50" fill="none" stroke="rgba(233,230,221,0.045)" stroke-width="1"/>
</pattern>
</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect width="800" height="500" fill="url(#grid)"/>
<!-- FIT is computed per frame: the motif is measured, then scaled and
     translated so every drawing sits dead centre and carries the same
     visual weight. The old wrapper scaled about (400,250), which is not
     the centre of a 480x300 canvas, so everything drifted up and left. -->
<g transform="translate(-116.80,-54.00) scale(1.9000)"
   stroke="rgba(233,230,221,0.72)" fill="none" stroke-width="1.32" stroke-linecap="square"
   vector-effect="non-scaling-stroke">
<rect x="196" y="70" width="212" height="132" rx="5" stroke="rgba(233,230,221,0.2)"/><rect x="166" y="94" width="212" height="132" rx="5" stroke="rgba(233,230,221,0.34)"/><rect x="136" y="118" width="212" height="132" rx="5" stroke="rgba(233,230,221,0.92)" fill="rgba(233,230,221,0.06)"/><path d="M136 214 L188 176 L226 206 L268 166 L348 222" stroke="rgba(233,230,221,0.62)"/><circle cx="188" cy="146" r="9" stroke="rgba(233,230,221,0.62)"/>
</g>
<rect x=".5" y=".5" width="799" height="499" fill="none" stroke="rgba(233,230,221,0.1)"/>

</svg>